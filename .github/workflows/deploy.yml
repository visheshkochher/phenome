# Builds the press kit and publishes it to GitHub Pages on every push to main.
#
# REQUIRED ONCE, BY HAND: Settings → Pages → Source = "GitHub Actions".
# Until that is set this workflow fails with "Resource not accessible by
# integration" — the token can deploy to Pages but cannot create the site.
#
# BASE_PATH must match how the site is served:
#   • project page  https://<user>.github.io/<repo>/   →  /<repo>/   (the default below)
#   • custom domain or user page                       →  /
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Reads the Pages config so the build knows its own URL. It cannot create
      # the Pages site — the Actions token is not allowed to — so Pages must be
      # switched on once by hand under Settings → Pages → Source = GitHub Actions.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
